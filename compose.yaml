# Example Docker Compose setup for Mayuri2000.
#
# The image is built by Nix, not a Dockerfile. Copy env.example to .env,
# fill in DISCORD_TOKEN, then start the bot with the helper script, which
# builds and loads the image first if it isn't present locally:
#   cp env.example .env
#   ./docker-up.sh
#   docker compose logs -f
#
# To update after changing the bot: nix build .#image && docker load < result

services:
  mayuri:
    image: mayuri2000:latest
    container_name: mayuri2000
    restart: unless-stopped
    # All configuration comes from this file; see env.example for every option.
    env_file:
      - .env
    # SQLite database (prefixes, aliases, feeds, reminders, stats) lives in /data.
    # The image runs as uid/gid 10001; data from an older root image needs a
    # one-time chown (see "Upgrading from a root image" in the README).
    volumes:
      - mayuri-data:/data

    # Hardening: the bot parses untrusted images and videos, so contain it.
    # It only writes to /data and /tmp, needs no capabilities (outbound
    # connections only), and keeps the runtime's default seccomp profile.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777 # ffmpeg/ImageMagick scratch space; counts toward mem_limit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512 # threads + a few concurrent magick/ffmpeg jobs; stops fork bombs
    mem_limit: 3g # covers several image jobs plus /tmp; raise if large jobs get OOM-killed

volumes:
  mayuri-data:
