# Example Docker Compose setup for Mayuri2000.
#
# The image is built by Nix, not a Dockerfile. Copy env.example to .env,
# fill in DISCORD_TOKEN, then start the bot with the helper script, which
# builds and loads the image first if it isn't present locally:
#   cp env.example .env
#   ./docker-up.sh
#   docker compose logs -f
#
# To update after changing the bot: nix build .#image && docker load < result

services:
  mayuri:
    image: mayuri2000:latest
    container_name: mayuri2000
    restart: unless-stopped
    # All configuration comes from this file; see env.example for every option.
    env_file:
      - .env
    # SQLite database (prefixes, aliases, feeds, reminders, stats) lives in /data.
    volumes:
      - mayuri-data:/data

volumes:
  mayuri-data:
