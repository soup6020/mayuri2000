version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      # Closing read-only resources and removing temp files/dirs can't meaningfully
      # fail in a way callers could handle. Close on writable files is still
      # checked.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - os.Remove
        - os.RemoveAll

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - mayuri2000
